*{box-sizing:border-box;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{background:#161b24}
body{font-family:J,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;min-height:100vh;display:flex;justify-content:center;background:#161b24}
main{width:100%;max-width:520px;min-height:100vh;background-color:#1E2530;padding:max(36px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));background:radial-gradient(520px 420px at 85% 0,#2b3548,#1E2530 62%)}
.logo{width:104px;height:104px;border-radius:30px;background:#EEF1F4;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px #E08D2E55,0 18px 40px #0007}
.logo img{width:80px;height:80px;border-radius:20px;display:block}
h1{font-weight:800;font-size:42px;line-height:1.04;margin-top:30px;letter-spacing:-.5px}
.role{color:#E08D2E;font-weight:700;font-size:19px;margin-top:10px}
.bar{width:56px;height:4px;background:#E08D2E;border-radius:2px;margin:20px 0 14px}
.tag{color:#c3ccda;font-size:16px;line-height:1.45;font-weight:700;max-width:none;margin-bottom:24px}
.row{display:flex;align-items:center;gap:15px;background:#273040;border-radius:16px;padding:13px 16px;margin-bottom:10px;text-decoration:none;color:inherit;transition:background .15s}
.row:hover,.row:focus-visible{background:#2f3a4d;outline:none}
.ib{width:42px;height:42px;border-radius:12px;background:#1E2530;display:flex;align-items:center;justify-content:center;flex:none}
small{display:block;color:#9fabbd;font-size:12.5px;font-weight:700}
b{display:block;font-size:16.5px;font-weight:700;margin-top:1px;overflow-wrap:anywhere}
.cta{display:block;margin-top:20px;background:#E08D2E;color:#1E2530;text-align:center;text-decoration:none;font-weight:800;font-size:19px;padding:17px;border-radius:16px}
.cta:hover,.cta:focus-visible{background:#eb9c3f;outline:none}
.sec{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;border:2px solid #E08D2E;color:#E08D2E;text-align:center;text-decoration:none;font-weight:800;font-size:17px;padding:13px;border-radius:16px}
.sec:hover,.sec:focus-visible{background:#E08D2E22;outline:none}
@media print{html,body{background:#1E2530}}
